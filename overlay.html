<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>W/L Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  :root{
    --cyan:#25F4EE;
    --pink:#FE2C55;
    --ink:#FFFFFF;
    --dim:rgba(255,255,255,.55);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:transparent; /* transparent for TikTok Studio Link Source */
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Anton', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .board{
    display:flex;
    align-items:center;
    gap:28px;
    padding:18px 26px;
    user-select:none;
  }

  .stat{
    display:flex;
    align-items:baseline;
    gap:10px;
    line-height:1;
  }

  .letter{
    font-size:40px;
    letter-spacing:1px;
    color:var(--dim);
  }

  .count{
    font-size:74px;
    color:var(--ink);
    min-width:1.1ch;
    text-align:center;
    transition:transform .12s ease;
  }

  .count.pulse{ transform:scale(1.18); }

  .divider{
    width:2px;
    height:64px;
    background:linear-gradient(180deg, var(--cyan), var(--pink));
    border-radius:2px;
    opacity:.8;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="board">
    <div class="stat">
      <span class="letter">W</span>
      <span class="count" id="winCount">0</span>
    </div>
    <div class="divider"></div>
    <div class="stat">
      <span class="letter">L</span>
      <span class="count" id="lossCount">0</span>
    </div>
  </div>
</div>

<script>
  const winEl = document.getElementById('winCount');
  const lossEl = document.getElementById('lossCount');

  let localState = { win: 0, loss: 0, version: 0 };
  try {
    const saved = localStorage.getItem('wl_overlay_state');
    if (saved) {
      localState = JSON.parse(saved);
      winEl.textContent = String(localState.win ?? 0);
      lossEl.textContent = String(localState.loss ?? 0);
    }
  } catch(e) {}

  function pulse(el){
    el.classList.remove('pulse');
    requestAnimationFrame(() => el.classList.add('pulse'));
    setTimeout(() => el.classList.remove('pulse'), 150);
  }

  function applyScore(win, loss, version) {
    const newWin = String(win ?? 0);
    const newLoss = String(loss ?? 0);
    if(winEl.textContent !== newWin){ winEl.textContent = newWin; pulse(winEl); }
    if(lossEl.textContent !== newLoss){ lossEl.textContent = newLoss; pulse(lossEl); }
    localState = { win: Number(win ?? 0), loss: Number(loss ?? 0), version: version || Date.now() };
    try {
      localStorage.setItem('wl_overlay_state', JSON.stringify(localState));
    } catch(e) {}
  }

  async function rehydrateServer(win, loss, version) {
    try {
      await fetch('/api/score', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'sync', win, loss, version })
      });
    } catch(e) {}
  }

  async function poll(){
    try{
      const res = await fetch('/api/score', { cache: 'no-store' });
      const data = await res.json();
      
      const serverVersion = data.version || 0;
      const isInitialized = data.initialized !== false;

      if (!isInitialized) {
        // Server cold started and lost in-memory state
        if (localState.version > 0 && (localState.win > 0 || localState.loss > 0)) {
          // Re-hydrate server with our valid state
          await rehydrateServer(localState.win, localState.loss, localState.version);
          return;
        }
      }

      // If server has a newer or valid initialized state
      if (isInitialized && serverVersion >= localState.version) {
        applyScore(data.win, data.loss, serverVersion);
      }
    }catch(e){
      // retry next tick
    }
  }

  poll();
  setInterval(poll, 800);
</script>

</body>
</html>
